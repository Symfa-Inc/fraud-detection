[project]
name = "fraud-detection"
version = "0.1.0"
description = "Insurance claim fraud detection prototype based on the 2023 Travelers NESS Statathon Kaggle competition"
readme = "README.md"
authors = [
    { name = "Viacheslav Danilov", email = "viacheslav.v.danilov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pre-commit>=4.5.1",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
install_types = true
no_strict_optional = true
ignore_missing_imports = true
explicit_package_bases = true

[project.scripts]
fraud-detection = "fraud_detection:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
